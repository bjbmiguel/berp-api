# dev/application.properties

# ============================================
# CONFIG DATA BASE
# ============================================

# Administrative URL (connects to the default 'postgres' database)
app.datasource.admin.url=jdbc:postgresql://${DB_HOST:localhost}:5433/postgres
app.datasource.admin.username=${spring.datasource.username}
app.datasource.admin.password=${spring.datasource.password}

# Target database URL (will be constructed by DataSourceConfig)
app.datasource.target-db=${DB_NAME:berp_db}
app.datasource.target.host=${DB_HOST:localhost}
app.datasource.target.port=${DB_PORT:5433}

# ============================================
# SPRING DATASOURCE (Will be overwritten by the customized Bean)
# ============================================

# This URL will be replaced by DataSourceConfig.
spring.datasource.url=jdbc:postgresql://${app.datasource.target.host}:${app.datasource.target.port}/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# ============================================
# HIKARI POOL
# ============================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=300000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPool-BERP-Dev

# ============================================
# JPA/HIBERNATE
# ============================================

# Important: validate or none to prevent attempts to create it beforehand.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# LOGS
# ============================================

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.springframework=INFO
logging.level.com.berp=DEBUG

# Servidor
server.port=8081