# prod/application.properties

# ============================================
# CONFIGURAÇÃO DO BANCO DE DADOS
# ============================================

# Administrative URL (connects to the default 'postgres' database)
app.datasource.admin.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/postgres
app.datasource.admin.username=${DB_USER}
app.datasource.admin.password=${DB_PASSWORD}

# Target database URL (will be constructed by DataSourceConfig)
app.datasource.target-db=${DB_NAME:berp_db}
app.datasource.target.host=${DB_HOST}
app.datasource.target.port=${DB_PORT:5432}

# ============================================
# SPRING DATASOURCE
# ============================================

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/postgres
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ============================================
# HIKARI POOL
# ============================================

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPool-BERP-Prod

# ============================================
# JPA/HIBERNATE
# ============================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ============================================
# LOGS
# ============================================

logging.level.root=WARN
logging.level.com.berp=INFO
logging.level.org.flywaydb=INFO

# Servidor
server.port=8080